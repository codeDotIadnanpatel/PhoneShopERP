# Development-only baseline. Add API/worker services after their projects exist.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smartphone_erp
      POSTGRES_USER: app_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_dev -d smartphone_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["optional-cache"]
    ports:
      - "6379:6379"

volumes:
  postgres_data:
