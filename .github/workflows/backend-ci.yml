name: backend-ci

# Phase 00 quality baseline (P00-W04-T01).
# Proves a clean checkout restores, formats, builds and tests with no developer
# secrets and no external services. The API has no database dependency yet, so
# this workflow intentionally does not start PostgreSQL.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject committed secrets and local environment files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files \
            | grep -Ei '(^|/)\.env$|(^|/)\.env\.[^/]+$|\.p(fx|12)$|\.key$|\.pem$|(^|/)secrets/' \
            | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::Tracked files must not contain secrets or local environment files:"
            echo "$forbidden"
            exit 1
          fi
          echo "No secret-like paths are tracked."

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Report SDK information
        run: dotnet --info

      - name: Restore
        run: dotnet restore backend/PhoneShopErp.slnx

      - name: Verify formatting and code style
        run: dotnet format backend/PhoneShopErp.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build backend/PhoneShopErp.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test backend/PhoneShopErp.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      # A skipped test is not a passing test. Check the TRX output explicitly
      # instead of trusting the aggregate exit code.
      - name: Assert no skipped tests
        if: always()
        shell: pwsh
        run: ./scripts/ci/Assert-NoSkippedTests.ps1 -ResultsDirectory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
